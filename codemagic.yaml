workflows:
  android-workflow:
    name: RUDAR SURVEYOR Android Build

    environment:
      flutter: stable

    scripts:
      - name: Create Flutter Android project
        script: |
          flutter create . --platforms=android --org com.rudarsurveyor

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build release APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
